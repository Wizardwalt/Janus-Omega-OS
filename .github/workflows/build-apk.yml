name: Build Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-apk:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/**/*.gradle*', 'android/gradle-wrapper.properties') }}

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Build release APK (unsigned)
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Rename APKs
        run: |
          VERSION="${GITHUB_REF_NAME:-dev}"
          find android -name "*.apk" | while read apk; do
            base=$(basename "$apk" .apk)
            cp "$apk" "janus-os-android-${VERSION}-${base}.apk"
          done
          ls -lh *.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: janus-os-android-debug
          path: '*-debug*.apk'
          retention-days: 30

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: janus-os-android-release
          path: '*-release*.apk'
          retention-days: 90

      - name: Attach to GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: '*.apk'
          body: |
            ## JanusOS Android APK

            Install on any Android 8.0+ device.

            **Sideload (no Play Store needed):**
            1. Enable "Install unknown apps" in Android Settings → Security
            2. Transfer the APK to your device
            3. Tap to install
            4. Open Janus Omega → Full Interface
            5. Set your server IP in Settings
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
