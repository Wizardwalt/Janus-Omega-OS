name: Build JanusOS (APK + ISO)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build_iso:
    name: "Build Tactical ISO"
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      options: --privileged
    steps:
      - uses: actions/checkout@v3

      - name: Install build dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm --needed archiso rust make git gcc pkg-config openssl python lua

      - name: Build Janus binary
        run: cargo build --release

      - name: Prepare ISO structure
        run: |
          cp -r /usr/share/archiso/configs/releng/ build_dir
          echo "android-tools" >> build_dir/packages.x86_64
          echo "libimobiledevice" >> build_dir/packages.x86_64
          echo "nmap" >> build_dir/packages.x86_64
          echo "aircrack-ng" >> build_dir/packages.x86_64
          echo "alacritty" >> build_dir/packages.x86_64
          echo "lua" >> build_dir/packages.x86_64
          mkdir -p build_dir/airootfs/usr/local/bin
          cp target/release/janus_omega build_dir/airootfs/usr/local/bin/janus
          chmod +x build_dir/airootfs/usr/local/bin/janus
          mkdir -p build_dir/airootfs/opt/janus
          cp -r plugins build_dir/airootfs/opt/janus/plugins
          mkdir -p build_dir/airootfs/root
          cat > build_dir/airootfs/root/.xinitrc << 'XINITRC'
#!/bin/sh
adb start-server &
xset s off
while true; do
  alacritty -o font.size=16 \
    -o "colors.primary.foreground='#00FF41'" \
    -o "colors.primary.background='#0A0A0A'" \
    -o "colors.cursor.cursor='#9D00FF'" \
    --working-directory /opt/janus \
    -e /usr/local/bin/janus
  sleep 1
done
XINITRC
          chmod +x build_dir/airootfs/root/.xinitrc
          echo '[[ -z $DISPLAY && $XDG_VTNR -eq 1 ]] && exec startx' >> build_dir/airootfs/root/.bash_profile

      - name: Build ISO
        run: cd build_dir && mkarchiso -v -w work/ -o out/ .

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: JanusOS-Titan-ISO
          path: build_dir/out/*.iso
        if: always()

  build_apk:
    name: "Build Android APK"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Generate Gradle wrapper JAR
        run: |
          wget -q "https://services.gradle.org/distributions/gradle-8.5-bin.zip" -P /tmp
          unzip -q /tmp/gradle-8.5-bin.zip -d /tmp/gradle
          mkdir -p gradle/wrapper
          /tmp/gradle/gradle-8.5/bin/gradle wrapper --gradle-version 8.5 --distribution-type bin
          chmod +x gradlew

      - name: Build APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JanusMobile-Debug
          path: app/build/outputs/apk/debug/*.apk
        if: always()
