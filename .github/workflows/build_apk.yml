name: Build Janus Mobile

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build_apk:
    name: "Build Android APK"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Generate Gradle wrapper JAR
        run: |
          wget -q "https://services.gradle.org/distributions/gradle-8.5-bin.zip" -P /tmp
          unzip -q /tmp/gradle-8.5-bin.zip -d /tmp/gradle
          mkdir -p gradle/wrapper
          /tmp/gradle/gradle-8.5/bin/gradle wrapper --gradle-version 8.5 --distribution-type bin
          chmod +x gradlew

      - name: Build APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JanusMobile-Debug
          path: app/build/outputs/apk/debug/*.apk
        if: always()
