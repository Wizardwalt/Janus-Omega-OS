name: "🟣 Build JanusOS Green & Purple Singularity 🟢"
on: workflow_dispatch
jobs:
  build_iso:
    name: "🟢 Compiling Purple Tactical ISO 🟣"
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      options: --privileged
    steps:
      - uses: actions/checkout@v3
      - run: pacman -Syu --noconfirm archiso rust cargo make git gcc pkg-config openssl python python-pip
      - run: cargo build --release
      - run: |
          cp -r /usr/share/archiso/configs/releng/ build_dir
          # HARDWARE DRIVERS (PIP-BOY/TITAN)
          echo "libnfc" >> build_dir/packages.x86_64
          echo "rtl-sdr" >> build_dir/packages.x86_64
          echo "lirc" >> build_dir/packages.x86_64
          # HACKING SUITE
          echo "android-tools" >> build_dir/packages.x86_64
          echo "libimobiledevice" >> build_dir/packages.x86_64
          echo "nmap" >> build_dir/packages.x86_64
          echo "bettercap" >> build_dir/packages.x86_64
          echo "aircrack-ng" >> build_dir/packages.x86_64
          echo "metasploit" >> build_dir/packages.x86_64
          # SYSTEM
          echo "alacritty" >> build_dir/packages.x86_64
          echo "lua" >> build_dir/packages.x86_64
          echo "python" >> build_dir/packages.x86_64
          # INJECTION
          mkdir -p build_dir/airootfs/usr/local/bin
          mkdir -p build_dir/airootfs/opt/janus/plugins
          cp target/release/janus_omega build_dir/airootfs/usr/local/bin/janus
          chmod +x build_dir/airootfs/usr/local/bin/janus
          cp plugins/*.lua build_dir/airootfs/opt/janus/plugins/
          # STARTUP
          echo -e '#!/bin/sh\nadb start-server &\nxset s off\nwhile true; do alacritty --working-directory /opt/janus -o font.size=16 -o "colors.primary.foreground='\''#00FF41'\''" -o "colors.primary.background='\''#0A0A0A'\''" -o "colors.cursor.cursor='\''#9D00FF'\''" -e /usr/local/bin/janus; sleep 1; done' > build_dir/airootfs/root/.xinitrc
          echo '[[ -z $DISPLAY && $XDG_VTNR -eq 1 ]] && exec startx' >> build_dir/airootfs/root/.bash_profile
      - run: cd build_dir && mkarchiso -v -w work/ -o out/ .
      - uses: actions/upload-artifact@v4
        with: { name: JanusOS-Titan-ISO, path: build_dir/out/*.iso }

  build_apk:
    name: "📱 Building Janus Mobile APK 📱"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
        continue-on-error: true

      - name: Build with Gradle
        run: ./gradlew assembleDebug --no-daemon --stacktrace
        continue-on-error: true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JanusMobile-Debug
          path: app/build/outputs/apk/debug/*.apk
        continue-on-error: true
