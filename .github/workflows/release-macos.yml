name: Build macOS Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-macos:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-latest
            arch: arm64
          - target: x86_64-apple-darwin
            runner: macos-13
            arch: x86_64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build
        run: cargo build --release --bin janus-web --target ${{ matrix.target }}

      - name: Package release bundle
        run: |
          ARCH="${{ matrix.arch }}"
          BUNDLE="janus-os-macos-${ARCH}"
          mkdir -p "${BUNDLE}"

          cp "target/${{ matrix.target }}/release/janus-web" "${BUNDLE}/"
          cp -r web             "${BUNDLE}/"
          cp -r plugins         "${BUNDLE}/"
          cp -r modules         "${BUNDLE}/"
          cp -r core            "${BUNDLE}/"
          cp -r apocalypse_engineering "${BUNDLE}/"

          cat > "${BUNDLE}/launch.sh" << 'LAUNCH'
          #!/bin/bash
          # JanusOS macOS launcher
          DIR="$(cd "$(dirname "$0")" && pwd)"
          cd "$DIR"
          echo "Starting JanusOS server..."
          ./janus-web &
          SERVER_PID=$!
          sleep 1
          echo "Opening browser..."
          open http://localhost:5000
          echo "JanusOS running on http://localhost:5000 (Ctrl+C to stop)"
          wait $SERVER_PID
          LAUNCH
          chmod +x "${BUNDLE}/launch.sh"

          cat > "${BUNDLE}/README.txt" << 'README'
          JanusOS — macOS Bundle
          ======================

          Quick start:
            ./launch.sh

          Manual start:
            ./janus-web
            # Then open http://localhost:5000 in your browser

          Requirements: macOS 11+ (Big Sur or later)
          README

          tar -czf "${BUNDLE}.tar.gz" "${BUNDLE}/"
          ls -lh "${BUNDLE}.tar.gz"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: janus-os-macos-${{ matrix.arch }}
          path: janus-os-macos-*.tar.gz
          retention-days: 90

      - name: Attach to GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: janus-os-macos-*.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
