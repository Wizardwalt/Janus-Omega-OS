name: Build JanusOS ISO

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build_iso:
    name: Build Tactical ISO
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      options: --privileged
    steps:
      - uses: actions/checkout@v3

      - name: Install dependencies
        run: pacman -Syu --noconfirm && pacman -S --noconfirm --needed archiso rust make git gcc pkg-config openssl python lua

      - name: Build Janus binary
        run: cargo build --release

      - name: Prepare ISO
        run: |
          cp -r /usr/share/archiso/configs/releng/ build_dir
          printf '%s\n' android-tools libimobiledevice nmap aircrack-ng alacritty lua >> build_dir/packages.x86_64
          mkdir -p build_dir/airootfs/usr/local/bin build_dir/airootfs/opt/janus build_dir/airootfs/root
          cp target/release/janus_omega build_dir/airootfs/usr/local/bin/janus
          chmod +x build_dir/airootfs/usr/local/bin/janus
          cp -r plugins build_dir/airootfs/opt/janus/plugins
          printf '#!/bin/sh\nadb start-server &\nxset s off\nwhile true; do alacritty -o font.size=16 -e /usr/local/bin/janus; sleep 1; done\n' > build_dir/airootfs/root/.xinitrc
          chmod +x build_dir/airootfs/root/.xinitrc
          printf '[[ -z $DISPLAY && $XDG_VTNR -eq 1 ]] && exec startx\n' >> build_dir/airootfs/root/.bash_profile

      - name: Build ISO
        run: cd build_dir && mkarchiso -v -w work/ -o out/ .

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: JanusOS-Titan-ISO
          path: build_dir/out/*.iso
        if: always()
