[package]
name = "janus_omega"
version = "3.5.1"
edition = "2021"

[dependencies]
tokio = { version = "1.32", features = ["full", "process"] }
anyhow = "1.0"
crossterm = "0.27"
ratatui = "0.26"
tui-logger = "0.9"
mlua = { version = "0.9", features = ["lua54", "vendored", "async", "send"] }
rusqlite = { version = "0.29", features = ["bundled"] }
chrono = "0.4"
machine-uid = "0.3"
reqwest = { version = "0.11", features = ["blocking", "json"] }
serde_json = "1.0"
serialport = "4.2"
atty = "0.2"
