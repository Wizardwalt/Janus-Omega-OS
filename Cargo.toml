[workspace]
resolver = "2"

members = [
    "janus-core",
    "janus-runtime",
    "janus-tui",
    "janus-web",
]

[workspace.package]
version = "3.5.1"
edition = "2021"
authors = ["Wizardwalt <wizardwalt@github.com>"]
license = "MIT"
repository = "https://github.com/Wizardwalt/Janus-Omega-OS"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.32", features = ["full", "process"] }
tokio-tungstenite = "0.21"

# Lua integration
mlua = { version = "0.9", features = ["lua54", "vendored", "async", "send"] }

# Database
rusqlite = { version = "0.29", features = ["bundled"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Web framework
axum = { version = "0.7", features = ["ws"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["fs", "cors"] }

# Time
chrono = "0.4"

# Other utilities
anyhow = "1.0"
crossterm = "0.27"
ratatui = "0.26"
tui-logger = "0.9"
reqwest = { version = "0.11", features = ["blocking", "json"] }
machine-uid = "0.3"
serialport = "4.2"
atty = "0.2"
clap = { version = "4.4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[workspace.lints.rust]
unsafe_code = "warn"
missing_docs = "warn"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
nursery = "warn"
